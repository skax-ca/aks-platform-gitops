# Karpenter NodePool/AKSNodeClass — ②opt-in 카탈로그 addon (Node Auto-Provisioning CR)
#
# 설계: AWS 원본 skax-ca/eks-platform-gitops의 applicationsets/baseline/karpenter.yaml
#       (② CR 섹션)을 대조해 포팅하되, 세 가지를 다르게 간다:
#
# 1. 컨트롤러 ApplicationSet이 없다 — AKS Node Auto-Provisioning(NAP)은 컨트롤러 자체를
#    Azure가 완전 관리형으로 배포·운영한다(Microsoft 공식문서 aks/node-auto-provisioning:
#    "NAP automatically deploys, configures, and manages Karpenter on your AKS clusters").
#    aks-reference-infra의 live/hub/aks에서 enable_karpenter=true(Terraform,
#    node_provisioning_profile.mode=Auto) 하나로 끝난다 — 이 파일은 NodePool/AKSNodeClass
#    CR만 다룬다(AWS의 "① 컨트롤러" 섹션에 대응하는 게 없다).
#
# 2. baseline이 아니라 catalog(opt-in)다 — AWS는 Karpenter를 전 클러스터 필수(baseline)로
#    두지만, 이 저장소는 아직 hub만 NAP을 켠다(dev는 미정). 안 켠 클러스터에 이 CR을
#    밀어넣으면 karpenter.sh/karpenter.azure.com CRD가 없어 sync가 계속 실패 상태로
#    남는다 — cluster Secret의 addon-karpenter: enabled 라벨로 옵트인한다
#    (clusters/hub/*/cluster-secret.yaml의 라벨이 이 셀렉터의 짝이다).
#
# 3. 헬름 차트가 아니라 평문 매니페스트 디렉토리다 — AWS의 karpenter-nodepool 차트는
#    clusterName·nodeRole을 per-cluster로 주입해야 하지만(EC2NodeClass가 subnet/SG를 태그
#    selector로 찾음), Azure AKSNodeClass는 그런 참조 필드 자체가 없다(공식 예제
#    github.com/Azure/karpenter-provider-azure examples/v1/general-purpose.yaml —
#    spec은 imageFamily 하나뿐, 네트워킹은 클러스터의 node_provisioning_profile이 이미
#    소유한 VNet 통합에서 자동 상속). 주입할 값이 없으니 템플릿도 없다.
#
# 🔴 Terraform 전제: aks-reference-infra의 live/hub/aks가 enable_karpenter=true로 NAP을 켠다.
#    NAP은 cni_mode=overlay·workload_identity_enabled=true와 system 노드풀
#    auto_scaling_enabled=false를 함께 요구한다 — 그 루트가 이미 이 값들을 갖는다.
#
# 🔴 이 hub 클러스터는 network_data_plane=cilium이다(live/hub/aks/main.tf) — Karpenter가
#    새로 띄우는 노드에도 Cilium daemonset이 붙기 전까지는 워크로드를 스케줄하면 안 된다.
#    upstream 공식 예제(examples/v1/general-purpose.yaml)의 cilium 전용 라벨+startupTaint를
#    그대로 가져온다(addons/karpenter/nodepool/nodepool.yaml 참고).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
            - key: addon-karpenter
              operator: In
              values: ["enabled"]
  template:
    metadata:
      name: '{{name}}-karpenter-nodepool'
      # 이 finalizer가 없으면 Application CR을 지워도 실제로 만든 리소스는 클러스터에
      # orphan으로 남는다(AWS 원본과 동일 근거 — spoke teardown에서 드러나는 문제다).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/karpenter/nodepool
      destination:
        server: '{{server}}'
        # NodePool·AKSNodeClass는 cluster-scoped라 이 ns는 형식상 값이다(AWS 원본과 동일 근거).
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # NAP을 막 켠 직후 CRD가 아직 반영 전인 첫 sync의 dry-run 실패를 피한다
          # (AWS 원본과 동일 근거 — 컨트롤러가 CRD를 심기 전에 CR을 apply하는 순서 문제다).
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
