# Gateway API 실사용 계층 — AKS App Routing 의 GatewayClass 를 참조한다.
#
# gatewayClassName: approuting-istio 는 AKS 가 컨트롤러 기동 시 자동 등록하는 이름이다. 이 저장소가
#    GatewayClass 를 따로 만들 필요가 없다.
# ⛔ HTTPRoute·백엔드 Service 는 여기 없다 — 계층 3(앱 GitOps)은 이 저장소 범위 밖이다. 앱팀이 이
#    Gateway 를 parentRefs 로 참조하는 HTTPRoute 를 자기 저장소에 만든다. 그 매니페스트는 Gateway API
#    표준이라 구현체가 바뀌어도 gatewayClassName 한 줄만 달라진다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway-system
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    annotations:
      # AKS 의 표준 internal LB annotation 하나로 내부 LB 가 된다. 서브넷 위임이 필요 없고,
      # AKS 클러스터 자신의 VNet 에 그대로 뜬다. App Routing 을 택한 핵심 이유가 이것이다.
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # HTTPRoute 의 Gateway 부착은 ReferenceGrant 가 아니라 이 필드가 통제한다
          # (ReferenceGrant 는 backendRefs·certificateRefs 같은 다른 cross-namespace 참조 전용).
          # All 대신 Selector 로 좁힌다 — 이 라벨을 단 네임스페이스만 이 Gateway 에 붙을 수 있다.
          from: Selector
          selector:
            matchLabels:
              shared-gateway/access: "true"
