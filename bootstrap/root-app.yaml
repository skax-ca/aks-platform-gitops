# root Application (App-of-Apps) — 부트스트랩의 마지막 seed 대상
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
#       (AWS 원본 skax-ca/eks-platform-gitops의 bootstrap/root-app.yaml 1:1 대응)
#
# 자기소멸(self-superseding) — 이 파일은 workbench에서 손으로 apply되지만, apply 직후
#    자기 자신을 source에 포함해 흡수(adopt)한다. 그 순간부터 이 리소스의 SSOT는 사람이
#    아니라 저장소가 된다. 손으로 apply하는 내용과 커밋본이 **바이트 단위로** 달라지면
#    영구 드리프트가 된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # finalizer를 일부러 넣지 않는다 — 이 Application을 지울 때 플랫폼 리소스 전체가
  # cascade 삭제되면 복구에 seed를 다시 밟아야 한다.
spec:
  project: platform

  source:
    # self-managed는 GitHub를 직접 읽는다. 인증은 **GitHub App** repository Secret이다
    # (기존 skax-ca-gitops-reader App 재사용 — 이 저장소가 그 App의 설치 범위에 들어가야
    #  하고, eks-platform-gitops용으로 발급된 private key와 같은 파일을 쓴다).
    repoURL: https://github.com/skax-ca/aks-platform-gitops.git
    targetRevision: main
    # 저장소 루트 전체를 스캔한다 — projects/·clusters/·addons/가 모두 대상이며,
    # 새 디렉토리가 늘어도 이 파일은 불변이다.
    path: .
    directory:
      recurse: true
      # 스캔 제외(k8s 매니페스트가 아닌 것):
      #   - clusters/**/values.yaml: helm values. ** 라 depth 무관.
      #     cluster-secret.yaml은 제외 대상이 아니라 그대로 recurse(클러스터 등록 매니페스트).
      #   - bootstrap/argocd-values.yaml: ArgoCD 자신의 helm values(자기 관리의 SSOT).
      #     ⚠️ 빼먹으면 root App이 이것을 매니페스트로 오인해 sync가 깨진다.
      #
      # 🔴 **이 목록을 늘리지 않는다 — 새로 제외할 파일에는 skip-rendering 마커를 넣는다**
      #    (README의 "root App 스캔에서 파일을 빼는 방법" 절이 마커 문자열과 사용법을 소유한다,
      #    AWS 원본 README와 동일 규약).
      #    ⛔ **이 파일에 그 마커 문자열을 적지 말 것** — 판정이 파일 전체 문자열 포함 검사라
      #       주석에 적기만 해도 root-app.yaml이 **자기 자신을 스캔에서 제외**한다.
      #    이 목록에 새 glob 패턴(`addons/gateway/shared-gateway/**` 등)을 추가하면
      #    **자기소멸 데드락**을 만든다:
      #      · root-app은 자기 spec을 git에서 읽어 갱신하는데, 그러려면 먼저 저장소를 렌더해야 한다
      #      · 렌더는 **아직 적용되지 않은 옛 exclude**로 수행된다
      #      · 옛 exclude는 새 차트 템플릿을 걸러내지 못한다 → ComparisonError
      #      · 렌더가 실패하니 새 exclude가 영원히 적용되지 않는다 (무한 루프)
      #    ⇒ 마커는 파일 안에 있으므로 이 spec을 건드리지 않는다. **순서 제약이 아예 없다.**
      exclude: '{clusters/**/values.yaml,bootstrap/argocd-values.yaml}'

  destination:
    # ⚠️ projects/platform.yaml의 destinations와 같은 값이어야 한다.
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # 손으로 바꾼 것을 저장소 상태로 되돌린다 — 자기소멸 원칙의 집행 장치.
      selfHeal: true
      # ⚠️ prune은 **의도적으로 끈다**. root 레벨에서 켜면 저장소 실수 하나가 platform
      #    AppProject와 cluster Secret까지 지워 seed를 다시 밟아야 한다.
      #    하위 ApplicationSet에서는 prune을 켠다.
      prune: false
