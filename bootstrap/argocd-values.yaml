# ArgoCD helm values — seed 0단계의 입력이자, 이후 자기 관리(self-management)의 SSOT
#
# 설계: aks-reference-infra의 .omc/plans/aks-platform-gitops-scaffold.md
#       (AWS 원본 skax-ca/eks-platform-gitops의 bootstrap/argocd-values.yaml 1:1 대응)
# chart: argo-cd 10.3.0 (appVersion v3.5.0) — 정확 핀, AWS 원본과 동일 버전
#
# 자기소멸(self-superseding) 원칙이 이 파일에도 걸린다.
#    `helm install -f`에 넘기는 values는 **이 커밋본 그대로**여야 한다.
#    ⛔ `--set`을 쓰지 않는다 — 그 차이가 영구 드리프트로 남는다.
#
# ⚠️ 이 파일은 k8s 매니페스트가 아니다 → bootstrap/root-app.yaml의 exclude 대상이다.
#    빼먹으면 root App이 이것을 매니페스트로 오인해 sync가 깨진다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔑 **여기에는 chart 기본값과 다른 것만 적는다.**
#    기본값을 그대로 옮겨 적으면 chart를 올릴 때 그 줄이 조용히 낡는다.
#    아래 "기본값을 유지하는 것" 주석이 그 판단의 기록이다.
# ─────────────────────────────────────────────────────────────────────────────

# ⛔ **AWS 원본에 있던 `global.tolerations`(workload-class=system taint 우회)는 여기 없다
#    — 원본에 없는 항목을 빼먹은 게 아니라 실측으로 확인한 차이다.**
#    `az aks show -g rg-demo-hub-krc-workload-01 -n aks-demo-hub-krc-main-01
#    --query "agentPoolProfiles[].nodeTaints"`로 확인(2026-09-04): 이 hub 클러스터의
#    유일한 노드풀(npsystem)은 nodeTaints가 null이다 — AWS hub가 쓰는 system 관리형
#    노드그룹의 NoSchedule taint에 대응하는 구성이 이 클러스터엔 없다(live/hub/aks/main.tf가
#    추가 node_pool을 정의하지 않음, default_node_pool 하나뿐). taint가 생기면(추가
#    node_pool 도입 등) 그때 이 값을 추가한다 — 지금 추가하면 죽은 설정이다.

# dex를 끈다.
#   seed는 local admin으로 시작하고, 이후 인증은 configs.cm.oidc.config를 소비자가 채운다.
#   OIDC 직결이면 dex는 불필요하고, 켜 두면 쓰지 않는 파드가 하나 도는 **죽은 경로**가 된다.
#   ⚠️ dex를 경유해야 하는 IdP(예: SAML-only)를 쓰게 되면 그때 다시 켠다.
dex:
  enabled: false

# notifications controller를 끈다.
#   즉 이 줄은 "기능을 막는 것"이 아니라 **"기본값을 안 켜는 것"**이고, 그 기능이 실제로
#   필요해지는 시점의 유일한 진입점이다.
notifications:
  enabled: false

# controller·server를 hub ArgoCD Workload Identity(aks-reference-infra의
# live/hub/vwan이 만든 UAMI, client-id는 그 root의 output)로 federate한다.
#   설계: aks-reference-infra의 .omc/plans/dev-gitops-registration.md(6.5차 패치)
#   annotations(ServiceAccount)·podLabels(Pod) 둘 다 있어야 웹훅이 토큰 파일을
#   주입한다 — 하나만 있으면 조용히 무동작이다(argo-helm 10.3.0 values.yaml 스키마
#   확인, controller.serviceAccount.annotations + controller.podLabels 조합).
#   application-controller가 실제로 스포크 API 서버와 통신해 reconcile하고,
#   server는 UI·CLI·`argocd app diff` 경로에서 같은 API를 호출한다(둘 다 필요).
controller:
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "35e68e71-1bfe-4374-950e-1bae83e5f3e0"
  podLabels:
    azure.workload.identity/use: "true"

server:
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "35e68e71-1bfe-4374-950e-1bae83e5f3e0"
  podLabels:
    azure.workload.identity/use: "true"

# ─────────────────────────────────────────────────────────────────────────────
# 기본값을 유지하는 것 — 판단의 기록 (여기에 값을 적지 않는다)
# ─────────────────────────────────────────────────────────────────────────────
# server.service.type: ClusterIP
#   노출을 만들지 않는다. 사람은 workbench 경유 port-forward로 닿는다(AWS 원본과 동일 원칙,
#   Azure workbench는 aks-reference-infra live/hub/workbench가 별도로 진행 중).
#   ⛔ internal Application Gateway/Ingress는 새 리소스가 필요하고 고객사마다 다르다.
#
# redis-ha.enabled: false · 각 컴포넌트 replicas: 1
#   현재 유일한 실증 환경이 hub 단일 클러스터다.
#   HA가 필요해지면 redis-ha.enabled와 replicas를 소비자 값으로 켠다.
#   ⚠️ hub SPOF의 비용은 "복구까지 pull이 멈춘다"이고, desired state는 Git에 그대로 있다.
#
# crds.install: true · crds.keep: true
#   ⚠️ uninstall해도 CRD가 남는다.
#
# configs.params."server.insecure": (미설정 → TLS 유지)
#   argocd-server는 자체 서명 인증서로 HTTPS를 서빙한다. port-forward로 접속하면
#   https://localhost:8080에서 인증서 경고가 뜬다 — **정상이다.**
#   ⛔ insecure=true로 끄지 않는다: 편의를 위해 클러스터 내부 트래픽의 TLS를 없애는 교환이다.
#
# global.domain: argocd.example.com (chart 기본)
#   ingress·cert·SSO·notifications가 전부 이 값을 쓰는데 **우리는 그 넷을 다 안 쓴다** →
#   무해하다. ⛔ 가짜 도메인을 지어 넣지 않는다. Ingress를 도입할 때 실제 값을 넣는다.
