# hub 클러스터 등록 — ArgoCD 자신이 도는 클러스터다.
#
# 🔑 self-managed 에서 이 파일이 있는 이유는 연결이 아니라 라벨과 이름이다. ArgoCD 는 자신이 도는
#    클러스터에 ServiceAccount 로 이미 닿지만(내장 in-cluster), 그 항목에는 Secret 도 라벨도 없어서
#    cluster generator 가 매칭하지 못하고 {{name}} 이 `in-cluster` 가 된다. 이 Secret 이 내장
#    항목을 대체한다 — 중복이 아니다.
# 라벨 계약은 README 「cluster Secret 라벨 계약」이 갖는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 실제 AKS 클러스터명을 쓴다. 이 이름이 {{name}} 으로 여러 addon 리소스 이름에 흘러간다.
  name: aks-demo-hub-krc-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # baseline 팬아웃은 이 키의 존재만 검사한다. 값 자체는 분류용이다.
    environment: hub
    # ⚠️ 어휘는 nonprd | prd 둘로 고정이다. hub 는 control-plane 의 영구 거처라 prd 다.
    tier: prd
    region: krc
    # NAP 을 켠 클러스터만 NodePool/AKSNodeClass CR 을 받는다. aks-reference-infra 가
    #    enable_karpenter 로 NAP 을 켠 것과 짝을 이룬다.
    # ⛔ App Routing 용 라벨은 없다 — 클러스터 자체의 AKS 기능이라 GitOps 로 넘길 파라미터가 없다.
    addon-karpenter: enabled
type: Opaque
stringData:
  name: aks-demo-hub-krc-main-01
  # self-managed 는 클러스터 내부 워크로드라 이 URL 로 자기 apiserver 에 닿는다.
  server: https://kubernetes.default.svc
  # ⚠️ 이 값을 지정하면 그 프로젝트에서만 쓸 수 있는 project-scoped cluster 가 된다.
  #    projects/platform.yaml 의 이름과 어긋나면 UI 에 클러스터가 unknown 으로 뜨는데 증상이
  #    원인을 가리키지 않는다.
  project: platform
