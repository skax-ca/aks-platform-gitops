# 설계: AWS 원본 skax-ca/eks-platform-gitops의 require-karpenter-resources.yaml을
# 그대로 포팅했다 — 정책 자체는 Pod spec만 검증하는 클라우드 중립 로직이라 변경이 없다.
#
# 이 정책은 kyverno-policies(업스트림 PSS baseline)와 별개다 — 그 Application의 source는
#    upstream chart(kyverno-policies) 하나로 고정돼 있어 임의의 새 정책을 주입할 수 없다.
#    그래서 이 저장소가 직접 소유하는 정책은 형제 ApplicationSet(kyverno-custom-policies)으로
#    따로 둔다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-nodepool-resources
  annotations:
    policies.kyverno.io/title: Require CPU/Memory Requests and Memory Limit
    policies.kyverno.io/category: Platform
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      AKS Node Auto-Provisioning(NAP, karpenter-provider-azure 기반)은 파드의
      spec.containers[*].resources.requests를 기준으로 바인패킹·노드 크기·스케일링을
      계산한다. requests가 없으면 그 계산이 틀어지고, memory limit이 없으면 파드 하나가
      노드 메모리를 무제한으로 잠식해 다른 파드를 OOM으로 몰아낼 수 있다. 그래서
      requests(cpu·memory)와 memory limit을 필수로 요구한다.
      ⚠️ cpu limit은 의도적으로 요구하지 않는다 — CPU는 압축 가능한 자원이라 limit을
      걸면 스로틀링으로 지연시간이 튀는 문제가 있다. 이는 업스트림 Kyverno best-practice
      정책(require-requests-limits, kyverno.io/policies/best-practices)과 AWS EKS
      Best Practices Guide가 공통으로 권고하는 방향이며(AWS 원본 주석 그대로), Karpenter
      코어를 공유하는 NAP에도 동일하게 적용된다.
spec:
  # ⚠️ Enforce다 — Audit으로 먼저 관찰하지 않고 바로 차단한다(AWS 원본과 동일 결정).
  #    failurePolicy는 값을 적지 않는다 — ClusterPolicy 기본값이 Fail이고,
  #    Enforce와 Fail이 짝이 맞는 조합이다(applicationsets/baseline/kyverno.yaml의
  #    kyverno-policies가 Audit+Ignore로 짝을 맞춘 것과 반대 방향으로 같은 원칙).
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory-requests-and-memory-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
              # 이 정책이 실제로 지키려는 대상은 애플리케이션/플랫폼 addon 파드다 — AKS
              # 자신이 내부적으로 관리하는 시스템 네임스페이스는 매칭 단계에서 통째로
              # 뺀다. ⚠️ 빼지 않으면 관리형 addon이 뜨지 못한다: App Routing의 Istio
              # 구현체는 istiod Deployment를 aks-istio-system에 만들면서 requests/limits를
              # 선언하지 않아, Azure 내부 컨트롤러(user=aksService)의 재시도가 이 정책의
              # autogen Deployment 규칙에 매번 막힌다(에러는 Kyverno admission 로그에만
              # 남고 AKS 쪽은 조용히 재시도만 한다).
              # kube-system·aks-istio-system 둘 다 `kubernetes.azure.com/
              # managedby: aks` 라벨을 공유한다 — Microsoft 공식 문서(learn.microsoft.com/
              # en-us/azure/aks/core-aks-concepts, concepts-managed-namespaces)가 명시하는
              # "AKS가 관리하는 네임스페이스"의 표준 마커다. 개별 네임스페이스 이름을
              # exclude 목록에 하나씩 추가하는 대신 이 라벨로 걸러, Azure가 향후 또 다른
              # aks-*-system 네임스페이스로 관리형 addon을 내놓아도(예: 새 GA 기능) 이
              # 정책이 또 조용히 막는 사고가 재발하지 않게 한다.
              #
              # exclude 블록이 아니라 match 블록에 두는 이유: Kyverno의 오래된 버그
              # (github.com/kyverno/kyverno/issues/2608)가 exclude.resources.namespaceSelector가
              # 무시되는 사례를 보고했다 — match 블록의 namespaceSelector는 공식 문서
              # 예제에 그대로 나오는 경로라 이쪽을 쓴다.
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.azure.com/managedby
                    operator: NotIn
                    values:
                      - aks
      exclude:
        any:
          # ArgoCD는 AKS 관리형이 아니라(이 저장소가 GitOps로 직접 배포하는 플랫폼
          # 컴포넌트) 위 namespaceSelector로 걸러지지 않는다 — 별도로 제외한다. AWS
          # 원본과 동일 근거(argo-cd 차트 컴포넌트가 resources: {} 기본값이라 지금
          # 켜면 ArgoCD 자신의 재배포가 이 정책에 막힌다, bootstrap/argocd-values.yaml도
          # 채우지 않음).
          - resources:
              namespaces:
                - argocd
      validate:
        message: >-
          NAP이 올바르게 스케줄링하려면 모든 컨테이너에 CPU/메모리 requests와
          메모리 limit이 필요하다(cpu limit은 의도적으로 요구하지 않는다).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
