# dev 클러스터 등록 — 원격 클러스터, hub ArgoCD가 Azure RBAC로 접속한다.
#
# hub의 `server: https://kubernetes.default.svc` 매직 URL이 안 통하는 이유와 execProviderConfig
# 구조의 설계 근거는 iac-module-library의 docs/architectures/gitops-hub-spoke/azure/README.md
# 「클러스터 등록」이 갖는다. 라벨 계약은 이 저장소 README 「cluster Secret 라벨 계약」.
#
# ⚠️ 클러스터를 재생성할 때마다 server(fqdn)·config.tlsClientConfig.caData가 바뀐다.
#    projects/platform.yaml의 destinations도 같이 갱신한다 — 한쪽만 고치면 값이 낡아
#    스포크 팬아웃이 조용히 막힌다.
apiVersion: v1
kind: Secret
metadata:
  name: aks-demo-dev-krc-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # baseline 팬아웃은 이 키의 존재만 검사한다. 값 자체는 분류용이다.
    # ⚠️ 철거 때는 이 파일을 지우지 않고 이 라벨 하나만 뗀다. 접속 정보가 남아야 cascade delete가 돈다.
    # ⚠️ 어휘는 nonprd | prd 둘로 고정이다. dev는 상시 가동이 아닌 실증 환경이라 nonprd다.
    tier: nonprd
    region: krc
    # NAP을 켠 클러스터만 NodePool/AKSNodeClass CR을 받는다. aks-reference-infra가
    #    enable_karpenter로 NAP을 켠 것과 짝을 이룬다(hub와 동일하게 처음부터 켰다).
    addon-karpenter: enabled
type: Opaque
stringData:
  name: aks-demo-dev-krc-main-01
  # 공개 FQDN이지만 공개 DNS가 private IP를 반환한다(private_cluster_public_fqdn_enabled=true).
  server: https://aks-demo-dev-krc-main-01-iok6i30i.hcp.koreacentral.azmk8s.io:443
  # ⚠️ 이 값을 지정하면 그 프로젝트에서만 쓸 수 있는 project-scoped cluster가 된다.
  #    projects/platform.yaml의 이름과 어긋나면 UI에 클러스터가 unknown으로 뜨는데 증상이
  #    원인을 가리키지 않는다.
  project: platform
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "args": ["azure"],
        "env": {
          "AAD_LOGIN_METHOD": "workloadidentity",
          "AZURE_CLIENT_ID": "3e802ca6-e6b9-4cc5-8ae7-e1769b105d4d",
          "AZURE_TENANT_ID": "7d49e97a-1b9b-4907-81aa-24ff1ddf0bda",
          "AZURE_FEDERATED_TOKEN_FILE": "/var/run/secrets/azure/tokens/azure-identity-token",
          "AZURE_AUTHORITY_HOST": "https://login.microsoftonline.com/"
        },
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": { "caData": "" }
    }
