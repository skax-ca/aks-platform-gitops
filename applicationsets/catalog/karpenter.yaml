# Karpenter NodePool/AKSNodeClass — opt-in 카탈로그 addon. Node Auto-Provisioning 의 CR 이다.
#
# 컨트롤러 ApplicationSet 이 없다. AKS 의 NAP 은 Karpenter 컨트롤러 자체를 Azure 가 관리형으로
#    배포·운영하고, aks-reference-infra 의 live/hub/aks 가 enable_karpenter 하나로 켠다.
# opt-in 인 이유: NAP 을 켜지 않은 클러스터에 이 CR 을 밀어넣으면 CRD 가 없어 sync 가 계속 실패로
#    남는다. cluster Secret 의 addon-karpenter 라벨이 이 selector 의 짝이다.
# 평문 매니페스트인 이유: AKSNodeClass 에는 주입할 per-cluster 값이 없다. 네트워킹은 클러스터의
#    node_provisioning_profile 이 소유한 VNet 통합에서 자동 상속된다.
# ⚠️ 이 클러스터는 데이터 플레인이 Cilium 이라, 새 노드에 Cilium daemonset 이 붙기 전에는
#    워크로드를 스케줄하면 안 된다. 그 startupTaint 는 addons/karpenter/nodepool/nodepool.yaml 이 건다.
# Terraform 전제: NAP 은 overlay CNI·workload identity·시스템 노드풀 오토스케일 해제를 함께 요구한다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
            - key: addon-karpenter
              operator: In
              values: ["enabled"]
  template:
    metadata:
      name: '{{name}}-karpenter-nodepool'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/karpenter/nodepool
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # NAP 을 막 켠 직후 CRD 가 아직 반영되기 전인 첫 sync 의 dry-run 실패를 피한다.
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
