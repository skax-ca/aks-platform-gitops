# +argocd:skip-file-rendering
#   ⚠️ 이 마커는 root-app(directory 소스)이 이 파일을 매니페스트로 읽지 않게 한다
#      (README의 "root App 스캔에서 파일을 빼는 방법" 절 참조).
apiVersion: v2
name: shared-gateway
description: |
  Gateway API 실사용 계층 — 계층 2(플랫폼 GitOps)가 소유하는 Gateway 리소스 하나.
  계층 3(HTTPRoute·백엔드 라우팅 규칙)은 이 저장소 범위 밖이다(README "이 저장소가
  다루는 것 / 다루지 않는 것" 참조 — apps/ 디렉토리를 두지 않는다).

  ⚠️ per-cluster 값이 전혀 없는데도(App Routing은 workload identity·subnet 같은
     파라미터가 필요 없다) 이 차트가 helm인 이유는 값 주입이 아니라 **마커 메커니즘
     때문**이다 — `+argocd:skip-file-rendering` 마커는 root-app뿐 아니라 "Directory
     타입으로 이 파일을 읽는 모든 Application"에서 렌더링을 막는다(README 참조). 이
     디렉토리를 평문 Directory 소스로 노출하면 addons/baseline/gateway.yaml의 전담
     ApplicationSet 자신도 이 마커에 걸려 아무것도 렌더하지 못한다(2026-09-07 실측
     확인 — Application이 Synced/Healthy로 보이지만 실제로는 리소스 0개, `argocd app
     manifests`가 빈 출력을 반환했다). Chart.yaml이 있는 디렉토리를 전담 소스로
     참조하면 Helm 타입으로 인식돼 이 함정을 피한다(karpenter-nodepool과 동일 이유,
     다만 그쪽은 진짜 값 주입도 필요했다는 차이가 있다) — 차트 하나에 템플릿 하나.
type: application
version: 0.1.0
