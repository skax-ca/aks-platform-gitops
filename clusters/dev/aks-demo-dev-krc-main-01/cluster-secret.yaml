# dev(spoke) 클러스터 등록 — 등록의 GitOps 절반
#
# 설계: aks-reference-infra의 .omc/plans/dev-gitops-registration.md "## 8차" 절
#       (인증: Entra Workload Identity + argocd-k8s-auth azure, DNS: 신뢰
#        private_cluster_public_fqdn_enabled — zone VNet link 불필요)
#
# hub와 달리 dev는 ArgoCD가 도는 클러스터가 아니라 **원격** 클러스터라 진짜 연결
# 정보(server·인증)가 필요하다 — hub의 in-cluster 대체용 Secret과는 성격이 다르다.
#
# 2026-09-09 spoke-lifecycle.md 철거→재구축 실측 검증(14절) — dev를 destroy 후
# 재생성해 server(FQDN)·caData가 실제로 바뀌는 것을 확인, 이 재등록으로 갱신했다.
# addon-karpenter 라벨은 그대로 유지한다(빠뜨리면 addon 구독이 조용히 빠진 채
# 재배포된다는 AWS 원본과 동일한 함정 — eks-platform-gitops 8faafa5 참고).
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 이름은 실제 AKS 클러스터명 — ApplicationSet cluster generator의 {{name}}이
  #    여러 addon 리소스 이름에 그대로 흘러가므로 live/dev/aks naming과 일치시킨다.
  name: aks-demo-dev-krc-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수) — 철거 중에도 남긴다.
    # spoke-lifecycle.md 10절: secret-type까지 지우면 cascade delete의 finalizer가
    # 대상 클러스터 접속 방법을 잃어 orphan이 생긴다.
    argocd.argoproj.io/secret-type: cluster
    tier: dev
    region: krc
    # 2026-09-10 dev 철거 절차(spoke-lifecycle.md 10절) — fan-out 매칭 라벨만 제거.
    # environment·addon-karpenter 제거 완료, baseline/opt-in ApplicationSet 재평가 후
    # addon 소멸 확인되면 이 Secret 자체를 삭제한다.
type: Opaque
stringData:
  name: aks-demo-dev-krc-main-01
  # private_cluster_public_fqdn_enabled=true로 얻은 공개 FQDN — 일반 공개 DNS가
  # private IP를 직접 반환해 hub에서 vWAN 라우팅만으로 도달 가능함을 실측 확인함
  # (dev-gitops-registration.md "## 8차"). :443은 AKS가 발급하는 kubeconfig의
  # 표준 형식(az aks get-credentials 실측 확인). 재생성 때마다 랜덤 접미사가
  # 바뀐다(1amwkeg8 → 9z9xsbiw, 2026-09-09 destroy→apply 실측 확인).
  server: https://aks-demo-dev-krc-main-01-9z9xsbiw.hcp.koreacentral.azmk8s.io:443
  # ⚠️ 함정 — project를 지정하면 그 프로젝트에서만 destination으로 쓸 수 있는
  #    project-scoped cluster가 된다. projects/platform.yaml의 이름과 일치해야 한다.
  project: platform
  # execProviderConfig: 정적 토큰 없이 hub ArgoCD의 Entra Workload Identity로
  # 런타임에 토큰을 즉시 발급한다(kubelogin이 아니라 ArgoCD 번들 argocd-k8s-auth —
  # 컨테이너 이미지에 kubelogin 자체가 없음을 실측 확인, 3차 초안 Critic C3).
  # env 값은 전부 식별자이지 시크릿이 아니다 — git에 커밋할 시크릿이 없다.
  # AZURE_CLIENT_ID·AZURE_TENANT_ID는 hub UAMI 값 — dev 재생성과 무관하게 고정.
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "args": ["azure"],
        "env": {
          "AAD_LOGIN_METHOD": "workloadidentity",
          "AZURE_CLIENT_ID": "35e68e71-1bfe-4374-950e-1bae83e5f3e0",
          "AZURE_TENANT_ID": "7d49e97a-1b9b-4907-81aa-24ff1ddf0bda",
          "AZURE_FEDERATED_TOKEN_FILE": "/var/run/secrets/azure/tokens/azure-identity-token",
          "AZURE_AUTHORITY_HOST": "https://login.microsoftonline.com/"
        },
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      },
      "tlsClientConfig": {
        "caData": ""
      }
    }
