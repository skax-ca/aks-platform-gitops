# Gateway API 실사용 계층 — baseline addon. Gateway 리소스 하나를 얹는다.
#
# 🔑 이 addon 은 컨트롤러를 설치하지 않는다. aks-reference-infra 의 live/hub/aks 가 클러스터의
#    ingressProfile 을 켜는 순간 컨트롤러(istiod)·Gateway API CRD·GatewayClass 가 전부 AKS 관리형으로
#    그 클러스터 안에 나타난다. App Routing 을 고른 근거는 설계 문서가 갖는다.
# ⚠️ 순서 의존이 GitOps 밖에 있다. 다른 addon 은 sync-wave 로 "컨트롤러 먼저, CR 나중"을 GitOps 안에서
#    표현하지만, 여기서는 Terraform apply 가 먼저 끝나야 한다. 그 전에 sync 되면 Gateway 가
#    gatewayClassName 을 못 찾아 Accepted: False 로 멈춘다 — 에러가 아니라 조용한 대기이고,
#    selfHeal 이 켜져 있어 Terraform apply 가 끝나면 자동으로 풀린다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{name}}-gateway'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/gateway/shared-gateway
      destination:
        server: '{{server}}'
        namespace: gateway-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Terraform 이 ingressProfile 을 켜기 전에 이 Application 이 먼저 sync 되면 GatewayClass
          # 자체가 없어 dry-run 이 실패한다(위 헤더).
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
