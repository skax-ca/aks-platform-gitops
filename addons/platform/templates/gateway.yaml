# 공유 Gateway — wave 0(CR). Gateway 리소스 하나를 얹는다.
#
# wave 0 인 이유: 컨트롤러(istiod)·Gateway API CRD·GatewayClass 는 계층 1이 만들어 이 저장소 안에
#    기댈 addon 이 없다. aks-reference-infra 의 live/hub/aks 가 클러스터의 ingressProfile 을 켜는 순간
#    전부 AKS 관리형으로 그 클러스터 안에 나타난다. App Routing 을 고른 근거는 설계 문서가 갖는다.
# ⚠️ 그래서 이 Application 의 순서 의존은 wave 밖에 있다. Terraform apply 가 먼저 끝나야 한다. 그 전에
#    sync 되면 Gateway 가 gatewayClassName 을 못 찾아 Accepted: False 로 멈춘다. 에러가 아니라 조용한
#    대기이고, selfHeal 이 켜져 있어 Terraform apply 가 끝나면 자동으로 풀린다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "platform.name" . }}-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- include "platform.meta" (list . "gateway" "0") | nindent 2 }}
spec:
  project: platform
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: addons/gateway/shared-gateway
  destination:
    server: {{ include "platform.server" . }}
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Terraform 이 ingressProfile 을 켜기 전에 sync 되면 GatewayClass 자체가 없어 dry-run 이
      # 실패한다(위 헤더).
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
