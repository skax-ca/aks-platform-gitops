# Kyverno PSS 정책 — ①baseline addon (업스트림 kyverno-policies 차트, ClusterPolicy 11개)
#
# 설계: AWS 원본 skax-ca/eks-platform-gitops의 addons/baseline/kyverno-policies.yaml과 같다.
#
# **Kyverno 파일 3개 중 ②다** — ① 엔진은 `kyverno.yaml`, ③ 커스텀 정책은
#    `kyverno-custom-policies.yaml`. 파일이 나뉜 이유와 승격 순서는 `kyverno.yaml` 헤더가 갖는다.
#
# ⛔ **엔진(①)과 같은 마이너 라인을 유지한다.** 차트 번호 일치가 아니다. 이 차트가 요구하는
#    것은 엔진 app 버전의 **하한**이고(차트 README: PSS 정책은 Kyverno 1.6.0 이상), 라인이
#    갈리면 정책 내용이 전제한 app 버전과 어긋난다.
#    ⇒ 정책 **내용**만 보면 uniform이 맞지만, 엔진이 staged라 이것도 따라간다. 티어 **안에서는**
#      엔진과 정책이 항상 같은 라인이고, 차이는 승격 구간에만 있다.
#    ⚠️ 라인 안에서 엔진만 앞서는 것은 정상이다. 이 차트는 그 라인 최신 패치에 두면 된다
#       (엔진 단독 릴리스 8건의 근거는 `kyverno.yaml` 헤더가 갖는다).
#
# 차트 3.8.2 고정 근거(3.9.0이 아닌 이유)는 `kyverno.yaml` 헤더 1번 항목이 갖는다.
#
# 🔴 Terraform 전제: 없다. ①과 같다.
---
# ────────────────────────────────────────────────────────────────────────────
# ②-prd PSS 정책 — staged 전파의 prd 티어
# ────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # ⚠️ 돌고 있는 클러스터가 있을 때 이 이름을 바꾸지 않는다(`kyverno.yaml` 헤더 참조).
  name: kyverno-policies-prd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: prd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        # ①과 같은 원인(ClusterPolicy openAPI 스키마의 default:를 apiserver가 채움) —
        # AWS 원본과 동일 근거.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        # ①-prd 와 같은 마이너 라인. 이 라인(3.8)은 양쪽에 같은 번호가 있다.
        targetRevision: 3.8.2
        helm:
          parameters:
            # AWS 원본과 동일 결정: Audit(차트 기본, 유지) + Ignore(Fail에서 변경) —
            # "정책 위반 시 막지 않기로 했으면서 Kyverno 장애 시 전부 막는" 비정합을 없앤다.
            # background:true(차트 기본)라 웹훅을 놓쳐도 백그라운드 스캔이 PolicyReport를
            # 만든다 — 잃는 것은 실시간성뿐이다.
            - name: failurePolicy
              value: Ignore
        # ⛔ validationFailureAction을 적지 않는다 — Audit이 차트 기본값이다.
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
---
# ────────────────────────────────────────────────────────────────────────────
# ②-nonprd PSS 정책 — staged 전파의 nonprd 티어
#
# ⛔ **②-prd 와 함께 고친다.** failurePolicy 근거와 적지 않기로 한 값(validationFailureAction)은
#    위 블록이 소유한다. 값이 갈려야 하는 것은 `targetRevision` 뿐이다.
# ⛔ **①-nonprd 와 같은 마이너 라인을 유지한다.**
# ────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies-nonprd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: nonprd
  template:
    metadata:
      name: '{{name}}-kyverno-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno-policies
        # ①-nonprd 와 같은 마이너 라인. 승격 대기 중에는 prd 보다 앞선다.
        targetRevision: 3.8.2
        helm:
          parameters:
            # Audit + Fail 비정합을 피한다 — 근거 전문은 ②-prd 블록.
            - name: failurePolicy
              value: Ignore
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
