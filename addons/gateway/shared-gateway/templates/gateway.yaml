# Gateway API 실사용 계층 — AKS App Routing(Istio 기반) GatewayClass를 참조한다.
# `gatewayClassName: approuting-istio`는 AKS가 컨트롤러 기동 시 자동 등록하는 이름
# (learn.microsoft.com/en-us/azure/aks/app-routing-gateway-api — "Gateway Class name"
# 표) — 이 저장소가 GatewayClass를 따로 만들 필요가 없다.
#
# 내부 LB는 `spec.infrastructure.annotations`에 표준 AKS Service annotation을 얹는
# 것으로 끝난다(learn.microsoft.com/en-us/azure/aks/istio-gateway-api의 "Annotation
# customizations" 절, Gateway API v1의 infrastructure 필드 — 별도 CR·ConfigMap
# 불필요).
#
# ⛔ HTTPRoute·백엔드 Service는 여기 없다 — 계층 3(앱 GitOps)은 이 저장소 범위 밖이다
#    (README "이 저장소가 다루는 것 / 다루지 않는 것" 참조, apps/ 디렉토리는 의도적으로
#    없다). 앱팀은 이 Gateway를 parentRefs로 참조하는 HTTPRoute를 **자기 저장소**에
#    만든다 — 그 매니페스트는 구현체가 AGFC든 App Routing이든 100% 동일하다(Gateway
#    API 표준, gatewayClassName 한 줄만 구현체마다 다르다).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway-system
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    annotations:
      # AKS의 표준 internal LB annotation(수년 전부터 GA, cloud-provider-azure 소유 —
      # learn.microsoft.com/en-us/azure/aks/internal-lb). live/hub/networking의 어느
      # 서브넷에도 위임이 필요 없다 — AKS 클러스터 자신의 VNet(aks-node 서브넷이 속한
      # VNet)에 그대로 내부 LB가 뜬다. 이게 이 저장소가 AGFC 대신 App Routing을 택한
      # 핵심 이유다 — AGFC는 frontend가 공인 FQDN만 지원해 이 옵션 자체가 없었다
      # (Microsoft 공식 문서로 확정, addons/baseline/gateway.yaml 헤더 참고).
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # HTTPRoute의 Gateway 부착 자체는 ReferenceGrant가 아니라 이 필드가 통제한다
          # (Gateway API 공식 문서 — allowedRoutes.namespaces가 Route→Gateway attach
          # 담당, ReferenceGrant는 backendRefs·certificateRefs 같은 다른 cross-namespace
          # 참조 전용). All 대신 Selector로 좁힌다 — 이 라벨을 단 네임스페이스만 이
          # Gateway에 붙을 수 있다(AGFC 시절과 동일 판단·동일 라벨).
          from: Selector
          selector:
            matchLabels:
              shared-gateway/access: "true"
