# Application Gateway for Containers (AGFC) ALB Controller — ①baseline addon (전 클러스터)
#
# 설계: aks-reference-infra의 .omc/plans/aks-platform-gitops-scaffold.md 1-3절
#       (AWS 원본 skax-ca/eks-platform-gitops의 addons/baseline/aws-load-balancer-controller.yaml
#       구조를 그대로 따르되, ALB controller와 CR 소유를 분리해 ApplicationSet 2개로 구성 -
#       원본이 이미 Karpenter 컨트롤러/CR을 이렇게 분리한 전례와 동형)
#
# 이 파일은 **클러스터 수와 무관하게 불변**이다. 새 클러스터 = cluster Secret 1개
#    (+ per-cluster values.yaml, 아래 ②) 추가로 끝난다.
#
# 네임스페이스 = azure-alb-system(전용 신설, AWS 원본의 kube-system 예외와 다름 - AGFC
#    공식 quickstart 문서가 이 네임스페이스를 지정한다).
#
# 🔴 IAM 자체(workload identity·federated credential·role assignment)는 Terraform
#    전제다(live/hub/aks/main.tf). 이 매니페스트는 **SA/clientID만** 맞춘다.
---
# ① 컨트롤러(OCI helm, sync-wave 0)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alb-controller
  namespace: argocd
spec:
  generators:
    # cluster generator — 라벨이 맞는 cluster Secret마다 Application을 1개씩 만든다.
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
            # 라벨 누락 시 배포 자체를 막는다 - 없으면 SA 애노테이션에 리터럴 "{{...}}"가
            # 들어가 런타임에만 조용히 실패한다(계획서 Architect 권고).
            - key: albControllerClientId
              operator: Exists
  template:
    metadata:
      name: '{{name}}-alb-controller'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform
      source:
        repoURL: mcr.microsoft.com/application-lb/charts
        chart: alb-controller
        # egress 확인 완료(canary, 2026-09-04) - private cluster에서 이 호스트에 실제로
        # 닿는다(http_code=200). 태그는 착수 시점 재조회값 - 올릴 때는 canary로 재확인.
        targetRevision: 1.11.4
        helm:
          releaseName: alb-controller
          parameters:
            - name: albController.namespace
              value: azure-alb-system
            - name: albController.podIdentity.clientID
              value: '{{metadata.labels.albControllerClientId}}'
      destination:
        server: '{{server}}'
        namespace: azure-alb-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          # 2026-09-07 실측+공식문서 확인: alb-controller 차트의 templates/common.yaml은
          # `{{- if not (eq .Release.Namespace .Values.albController.namespace) }}`일 때만
          # Namespace 리소스를 렌더한다 — Release.Namespace(ArgoCD가 destination.namespace를
          # 그대로 넘김)와 albController.namespace(위 helm.parameters, 둘 다
          # azure-alb-system)가 같아 조건이 거짓이 되고 Namespace가 아예 안 만들어져
          # "namespaces \"azure-alb-system\" not found"로 5회 재시도 실패하는 것을 확인했다
          # (helm template 직접 렌더 vs `argocd app manifests` 비교, kind 목록에 Namespace
          # 결측으로 확정). Microsoft 공식 Helm 퀵스타트(quickstart-deploy-application-
          # gateway-for-containers-alb-controller-helm)도 release 네임스페이스(--namespace)와
          # 컨트롤러 네임스페이스(--set albController.namespace)를 서로 다르게 두는 걸
          # 전제로 한다(둘이 같으면 차트가 아니라 호출자가 미리 만들어 둬야 함) — 이 설계는
          # 둘을 같은 값으로 뒀으므로 ArgoCD 쪽에서 대신 만들어줘야 한다. ArgoCD 공식 문서
          # (user-guide/sync-options#automatic-creation-of-namespace)의 CreateNamespace=true는
          # "차트가 Namespace를 렌더하든 안 하든" spec.destination.namespace를 sync 전에
          # 직접 생성해주므로 이 한 줄로 충분하다(위 clusterResourceWhitelist의 Namespace
          # 허용 항목은 유지 — 다른 addon이 실제로 Namespace 매니페스트를 렌더하는 경우를
          # 위해 남겨둔다).
          - CreateNamespace=true
---
# ② ApplicationLoadBalancer CR(로컬 helm 차트, sync-wave 5)
#
# ⚠️ **subnetId는 cluster Secret 라벨이 아니라 per-cluster values.yaml에서 온다.**
#    당초 계획(1-3 초안)은 `{{metadata.labels.albSubnetId}}`였으나, 실제 서브넷 리소스
#    ID(191자 + '/' 포함)가 K8s 라벨 값 제약(63자, `-_.`만 허용)을 실측으로 위반함을
#    확인(2026-09-04, clusters/hub/*/cluster-secret.yaml 헤더 참고) - 계획서가 예비해 둔
#    대안(values.yaml)으로 전환했다.
#
# 🔴 **matrix generator의 한계 - 클러스터가 2개 이상이 되면 재검증 필수.**
#    matrix(cluster + git files)는 두 생성기 결과의 **Cartesian product**이지 이름 기준
#    join이 아니다. 지금은 클러스터가 hub 하나뿐이라 1×1=1로 **우연히 맞는다**
#    (argocd-app.yaml이 이미 경고한 "단일 클러스터가 팬아웃 결함을 숨긴다"는 것과 같은
#    함정의 변종). dev를 두 번째 클러스터로 등록하는 순간 2×2=4개 조합이 생겨 **hub
#    클러스터가 dev의 subnetId를 받거나 그 반대가 될 수 있다.** 그 시점에 반드시
#    `values.yaml`의 디렉토리명(=cluster Secret 이름)과 실제 대상 클러스터가 일치하는지
#    `argocd appset generate`로 렌더 결과를 눈으로 확인할 것 - 필요하면 파일 생성기
#    경로를 클러스터별로 좁히거나(예: `clusters/{{name}}/values.yaml`는 matrix 안에서
#    직접 참조 불가라 실제로는 selector 기반 재설계가 필요할 수 있음) 별도 방식으로 교체한다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alb-loadbalancer
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: environment
                    operator: Exists
                  - key: addon-alb-controller
                    operator: In
                    values: ["enabled"]
          - git:
              repoURL: https://github.com/skax-ca/aks-platform-gitops.git
              revision: main
              files:
                - path: "clusters/*/*/values.yaml"
  template:
    metadata:
      name: '{{name}}-alb-loadbalancer'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: platform
      source:
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/alb-controller/loadbalancer # 로컬 helm 차트
        helm:
          parameters:
            - name: subnetId
              value: '{{albSubnetId}}'
      destination:
        server: '{{server}}'
        namespace: azure-alb-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
