{{- if eq .Values.addons.karpenter "enabled" }}
# Karpenter NodePool/AKSNodeClass — wave 2(CR), opt-in. Node Auto-Provisioning 의 CR 이다.
#
# wave 2 인 이유: 역할이 CR 이다. 컨트롤러와 CRD 는 계층 1(NAP)이 만든다.
# 🔑 이 NodePool 이 띄우는 NAP 노드에는 앱만 남는다. 플랫폼 컨트롤러(Kyverno)는 시스템 풀에 고정돼
#    여기에 기대지 않는다. 해제 때 이 NodePool 이 엔진보다 먼저 지워져도 엔진의 삭제 훅은 시스템 풀에서
#    돈다. 시스템 풀 taint 를 견디지 않는 컨트롤러를 새로 얹으면 그 전제가 깨진다.
# 컨트롤러 Application 이 없다. AKS 의 NAP 은 Karpenter 컨트롤러 자체를 Azure 가 관리형으로
#    배포·운영하고, aks-reference-infra 의 live/hub/aks 가 enable_karpenter 하나로 켠다.
# opt-in 인 이유: NAP 을 켜지 않은 클러스터에 이 CR 을 밀어넣으면 CRD 가 없어 sync 가 계속 실패로
#    남는다. cluster Secret 의 addon-karpenter 라벨이 이 조건의 짝이다.
# 평문 매니페스트인 이유: AKSNodeClass 에는 주입할 per-cluster 값이 없다. 네트워킹은 클러스터의
#    node_provisioning_profile 이 소유한 VNet 통합에서 자동 상속된다.
# ⚠️ 이 클러스터는 데이터 플레인이 Cilium 이라, 새 노드에 Cilium daemonset 이 붙기 전에는
#    워크로드를 스케줄하면 안 된다. 그 startupTaint 는 addons/karpenter/nodepool/nodepool.yaml 이 건다.
# Terraform 전제: NAP 은 overlay CNI·workload identity·시스템 노드풀 오토스케일 해제를 함께 요구한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "cluster-addons.name" . }}-karpenter-nodepool
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- include "cluster-addons.meta" (list . "karpenter-nodepool" "2") | nindent 2 }}
spec:
  project: platform
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: addons/karpenter/nodepool
  destination:
    server: {{ include "cluster-addons.server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # NAP 을 막 켠 직후 CRD 가 아직 반영되기 전인 첫 sync 의 dry-run 실패를 피한다.
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
{{- end }}
