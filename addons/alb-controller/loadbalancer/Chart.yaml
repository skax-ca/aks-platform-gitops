# +argocd:skip-file-rendering
#   ⚠️ 이 마커는 root-app(directory 소스)이 이 파일을 매니페스트로 읽지 않게 한다.
#      root-app의 exclude로 하지 않는 이유는 README의 "root App 스캔에서 파일을 빼는
#      방법" 절 참조(AWS 원본 skax-ca/eks-platform-gitops README와 동일 규약).
apiVersion: v2
name: alb-loadbalancer
description: |
  ApplicationLoadBalancer CR — 계층 2(플랫폼 GitOps)가 소유하는 인프라 CR.

  ⚠️ 이것이 helm 차트인 이유는 값을 추상화하고 싶어서가 아니다. ApplicationSet의
     fasttemplate이 **Application spec에만** 적용되고 git 경로 안의 파일에는 적용되지
     않기 때문이다 — per-cluster 값(subnetId)을 CR에 주입할 다른 수단이 없다.
     ⇒ 차트 하나에 템플릿 하나. 그 이상은 만들지 않는다(AWS 원본 karpenter-nodepool과 동형).
type: application
version: 0.1.0
