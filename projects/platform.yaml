# 플랫폼 AppProject — 계층 2(플랫폼 GitOps)의 가드레일
#
# seed 3단계다. 4·5단계(cluster Secret·root App)가 이 프로젝트를 참조하므로 반드시 먼저 선다.
# ⚠️ ArgoCD 의 `default` AppProject 는 세 목록이 전부 '*' 인 완전 개방 상태다. 플랫폼 리소스는
#    이 전용 프로젝트에만 둔다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: 플랫폼팀 소유 계층 2 리소스 (클러스터 등록·addon·컨트롤러 설정)

  # self-managed 에서는 강제가 아니지만 규약으로 argocd 하나에 고정한다.
  sourceNamespaces:
    - argocd

  # ⚠️ destinations·clusterResourceWhitelist 와 별개의 제3 가드레일이다 — Application 의
  #    repoURL 이 여기 없으면 InvalidSpecError 로 sync 자체가 안 선다. addon 을 추가할 때마다
  #    그 chart repo 를 여기 추가한다.
  #    App Routing 은 컨트롤러가 AKS 관리형이라 여기 추가할 repo 가 없다.
  sourceRepos:
    # 이 저장소 — seed 매니페스트와 평문 CR 디렉토리.
    - https://github.com/skax-ca/aks-platform-gitops.git
    # ArgoCD 자기 관리 — 이 줄이 없으면 bootstrap/argocd-app.yaml 이 sync 조차 서지 않는다.
    - https://argoproj.github.io/argo-helm
    # Kyverno. 엔진과 정책 두 차트가 같은 repo 에 있어 줄은 하나다.
    - https://kyverno.github.io/kyverno/

  # 등록된 클러스터만 허용. 새 클러스터 등록 시 여기에도 추가한다.
  destinations:
    # self-managed ArgoCD는 자신이 도는 클러스터를 이 URL로 가리킨다.
    - server: https://kubernetes.default.svc
      namespace: '*'
    # dev(spoke) AKS — 공개 FQDN 이지만 공개 DNS 가 private IP 를 반환한다. 이 형태를 고른 근거는
    # 설계 문서가 갖는다.
    # ⚠️ 클러스터를 재생성할 때마다 접미사가 바뀐다. clusters/dev/.../cluster-secret.yaml 의 server 와
    #    함께 갱신한다 — 한쪽만 고치면 이 값이 낡아 스포크 팬아웃이 조용히 막힌다.
    - server: https://aks-demo-dev-krc-main-01-vsj5lmr3.hcp.koreacentral.azmk8s.io:443
      namespace: '*'

  # 기본 차단으로 시작해 addon 마다 필요한 kind 만 연다. 목록은 각 차트를 렌더해 cluster-scoped
  # 항목을 추린 결과다. App Routing 은 컨트롤러가 AKS 관리형이라 이 프로젝트가 만드는
  # cluster-scoped 리소스가 없어 추가할 것이 없다.
  #
  # 🔑 self-managed 에서 이 목록이 유일한 실질 가드레일이다. argo-cd 차트 기본값이 application
  #    controller 에 cluster-admin 을 주므로 apiserver 쪽에는 막는 층이 없다.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace } # CreateNamespace=true 가 생성한다
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    # NAP 의 CR 둘. 컨트롤러는 Azure 관리형이라 RBAC·Deployment 를 이 프로젝트가 만들지 않는다.
    - { group: karpenter.sh, kind: NodePool }
    - { group: karpenter.azure.com, kind: AKSNodeClass }
    # ArgoCD 자기 관리가 argoproj.io CRD 3종을 흡수하는 데 필요하다. 빼면 seed 5단계가
    #    InvalidSpecError 로 막힌다.
    #    ⚠️ 이 목록은 {group,kind} 단위로만 걸러 리소스 이름으로 좁힐 수 없다 — 이 프로젝트의 다른
    #    Application 도 임의 CRD 를 만들 수 있게 되는 것이 이 완화의 대가다.
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    # Kyverno 가 배포하는 정책 CR — 업스트림 PSS 11개와 우리 커스텀 정책이 같은 kind 다.
    #    ⛔ legacy kyverno.io/ClusterPolicy 를 여기 두지 않는다. Kyverno v1.20 이 그 타입을 지워
    #       만들 수 없는 리소스가 되고, 남겨두면 쓰이지 않는 권한만 열어 두는 셈이다.
    #    ⚠️ ValidatingWebhookConfiguration 은 컨트롤러가 런타임에 동적 등록하므로 여기 넣을 것이
    #       없다 — 뒤집으면 웹훅이 잘못돼도 Application 은 Synced Healthy 로 보인다는 뜻이다.
    - { group: policies.kyverno.io, kind: ValidatingPolicy }

  # namespace 스코프는 전면 허용 — 플랫폼 계층은 관리자 tier다.
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
