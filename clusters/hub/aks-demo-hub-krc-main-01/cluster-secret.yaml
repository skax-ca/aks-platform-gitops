# hub 클러스터 등록 (ArgoCD 자신이 도는 클러스터) — 등록의 GitOps 절반
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/
#       (AWS 원본 skax-ca/eks-platform-gitops의 clusters/hub/*/cluster-secret.yaml 1:1 대응)
#
# **self-managed에서 이 파일이 존재하는 이유는 "연결"이 아니라 "라벨과 이름"이다.**
#    ArgoCD는 자신이 도는 클러스터에 ServiceAccount로 이미 닿는다(내장 `in-cluster`).
#    그러나 내장 항목에는 **Secret도 라벨도 없어서**:
#      - addon ApplicationSet의 cluster generator selector가 매칭되지 않아 팬아웃이 안 되고
#      - `{{name}}`이 `in-cluster`가 되어 addon 리소스 이름·파라미터에 틀린 값이 들어간다
#    ⇒ 라벨과 실제 클러스터명을 주기 위해 이 Secret을 만든다.
#
# ✅ 이 Secret은 내장 `in-cluster` 항목을 **대체한다. 중복이 아니다**
#    (`argocd admin cluster stats -n argocd`로 확인할 수 있다 - ArgoCD 자체 동작이라
#    클라우드 무관하게 그대로 적용된다).
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 이름은 **실제 AKS 클러스터명**을 쓴다 — ApplicationSet cluster generator의
  #    {{name}}이 여러 addon 리소스 이름에 그대로 흘러가므로 live/hub/aks/main.tf
  #    naming과 일치시켜 혼선을 없앤다.
  name: aks-demo-hub-krc-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ── baseline addon ApplicationSet selector 소스 ──
    # addons/baseline/gateway.yaml의 cluster generator는 이 키의 **존재만** 검사한다
    # (matchExpressions Exists) — 전 클러스터 자동 팬아웃, 값 자체는 분류용이다.
    environment: hub
    # hub는 ArgoCD control-plane의 영구 거처다(dev처럼 재구축 대상이 아니다) — prd로 분류.
    tier: prd
    region: krc
    # ⛔ Gateway API(App Routing)용 라벨은 여기 없다 — App Routing은 AKS 클러스터 자체의
    # 기능(live/hub/aks의 Terraform이 켠다)이라 workload identity도 per-cluster subnet도
    # GitOps 라벨로 넘길 파라미터가 없다(addons/baseline/gateway.yaml·
    # addons/gateway/shared-gateway/ 참고).
    # addons/catalog/karpenter.yaml의 opt-in 셀렉터. aks-reference-infra의 live/hub/aks가
    # enable_karpenter=true로 NAP을 켠 것과 짝을 이룬다 — 이 라벨만으로 NodePool/
    # AKSNodeClass CR이 이 클러스터에 팬아웃된다(dev는 아직 이 라벨이 없어 제외된다).
    addon-karpenter: enabled
type: Opaque
stringData:
  name: aks-demo-hub-krc-main-01
  # ⚠️ self-managed는 클러스터 내부 워크로드라 이 URL로 자기 apiserver에 닿는다.
  server: https://kubernetes.default.svc
  # ⚠️ 함정 — 이 값을 지정하면 그 프로젝트에서만 destination으로 쓸 수 있는 project-scoped
  #    cluster가 된다. projects/platform.yaml의 이름과 반드시 일치해야 한다.
  project: platform
