# ArgoCD helm values — seed 의 helm install 입력이자 이후 자기 관리의 SSOT
#
# 자기소멸 원칙이 이 파일에도 걸린다. `helm install -f` 에 넘기는 values 는 이 커밋본 그대로여야
#    한다. ⛔ `--set` 을 쓰지 않는다 — 그 차이가 영구 드리프트로 남는다.
# ⚠️ 이 파일은 k8s 매니페스트가 아니라서 root-app.yaml 의 include 목록에 없다. 넣으면 root App 이
#    매니페스트로 오인해 렌더가 깨진다.
# 🔑 차트 기본값과 다른 것만 적는다. 기본값을 옮겨 적으면 차트를 올릴 때 그 줄이 조용히 낡는다.
#    아래 「기본값을 유지하는 것」이 그 판단의 기록이다.
# 🔑 tolerations 를 받는 addon 은 ArgoCD 뿐이다. ⛔ 다른 addon 에 같은 값을 복사하지 않는다 —
#    그것들이 시스템 풀에서 밀려나 NAP 노드로 가는 것이 격리의 내용이다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/azure/

# 시스템 풀의 CriticalAddonsOnly=true:NoSchedule 를 견딘다. seed 시점에 ArgoCD 가 설 수 있는 노드는
#   그 풀뿐이다 — NAP 노드를 띄우는 NodePool CR 을 배포하는 것이 ArgoCD 자신이라, 이 값이 없으면
#   아무도 먼저 설 수 없다.
#   🔑 global 에 둬야 차트의 모든 컴포넌트가 상속한다(각 컴포넌트 tolerations 의 기본값이
#   global.tolerations 다). 컴포넌트마다 따로 적으면 하나를 빠뜨렸을 때 그 파드만 Pending 으로 남는다.
#   ⚠️ toleration 은 허용이지 선호가 아니다. ArgoCD 는 NAP 노드가 생긴 뒤에도 시스템 풀에 머물 수 있다.
global:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

# dex 를 끈다. OIDC 직결이면 불필요하고, 켜 두면 쓰지 않는 파드가 하나 도는 죽은 경로가 된다.
#   ⚠️ dex 를 경유해야 하는 IdP(SAML-only 등)를 쓰게 되면 그때 다시 켠다.
dex:
  enabled: false

# notifications controller 를 끈다. 알림을 쓰는 소비자가 이 값을 true 로 켠다.
notifications:
  enabled: false

# controller·server 를 hub ArgoCD 의 Workload Identity 로 federate 한다. client-id 는
#   aks-reference-infra 의 live/hub/aks 가 만든 UAMI 의 것이다(FIC 의 issuer 가 그 클러스터
#   자신의 OIDC issuer URL 에 묶여야 해서 aks root 가 만든다). hub 를 재구축하면 이 값이
#   새로 발급되므로 seed 전에 손으로 갱신한다. 읽는 법:
#   az identity show -g <워크로드 RG> -n id-<workload>-<env>-<region>-argocd-01 --query clientId
#   ⚠️ ServiceAccount annotations 와 Pod labels 이 **둘 다** 있어야 웹훅이 토큰 파일을 주입한다.
#   하나만 있으면 조용히 무동작이다. controller 는 스포크 API 서버와 통신해 reconcile 하고,
#   server 는 UI·CLI 경로에서 같은 API 를 호출하므로 둘 다 필요하다.
controller:
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "ec70a09c-8160-4ba6-8a25-2905d55b9376"
  podLabels:
    azure.workload.identity/use: "true"

server:
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "ec70a09c-8160-4ba6-8a25-2905d55b9376"
  podLabels:
    azure.workload.identity/use: "true"

# ── 기본값을 유지하는 것 — 판단의 기록 (여기에 값을 적지 않는다) ──
# server.service.type: ClusterIP
#   노출을 만들지 않는다. 사람은 workbench 경유 port-forward 로 닿는다.
#   ⛔ internal Application Gateway·Ingress 는 새 리소스가 필요하고 고객사마다 다르다.
#
# redis-ha.enabled: false · 각 컴포넌트 replicas: 1
#   현재 유일한 실증 환경이 hub 단일 클러스터다.
#   HA가 필요해지면 redis-ha.enabled와 replicas를 소비자 값으로 켠다.
#   ⚠️ hub SPOF의 비용은 "복구까지 pull이 멈춘다"이고, desired state는 Git에 그대로 있다.
#
# crds.install: true · crds.keep: true
#   ⚠️ uninstall해도 CRD가 남는다.
#
# configs.params."server.insecure": (미설정 → TLS 유지)
#   argocd-server는 자체 서명 인증서로 HTTPS를 서빙한다. port-forward로 접속하면
#   https://localhost:8080에서 인증서 경고가 뜬다 — **정상이다.**
#   ⛔ insecure=true로 끄지 않는다: 편의를 위해 클러스터 내부 트래픽의 TLS를 없애는 교환이다.
#
# global.domain: argocd.example.com (chart 기본)
#   ingress·cert·SSO·notifications가 전부 이 값을 쓰는데 **우리는 그 넷을 다 안 쓴다** →
#   무해하다. ⛔ 가짜 도메인을 지어 넣지 않는다. Ingress를 도입할 때 실제 값을 넣는다.
