# hub 클러스터 등록 (ArgoCD 자신이 도는 클러스터) — 등록의 GitOps 절반
#
# 설계: aks-reference-infra의 .omc/plans/aks-platform-gitops-scaffold.md 1-1절
#       (AWS 원본 skax-ca/eks-platform-gitops의 clusters/hub/*/cluster-secret.yaml 1:1 대응)
#
# **self-managed에서 이 파일이 존재하는 이유는 "연결"이 아니라 "라벨과 이름"이다.**
#    ArgoCD는 자신이 도는 클러스터에 ServiceAccount로 이미 닿는다(내장 `in-cluster`).
#    그러나 내장 항목에는 **Secret도 라벨도 없어서**:
#      - addon ApplicationSet의 cluster generator selector가 매칭되지 않아 팬아웃이 안 되고
#      - `{{name}}`이 `in-cluster`가 되어 ALB controller 파라미터에 틀린 값이 들어간다
#    ⇒ 라벨과 실제 클러스터명을 주기 위해 이 Secret을 만든다.
#
# ✅ 이 Secret은 내장 `in-cluster` 항목을 **대체한다. 중복이 아니다**(AWS 원본에서
#    `argocd admin cluster stats -n argocd`로 실측 확인된 동작 - ArgoCD 자체 동작이라
#    클라우드 무관하게 그대로 적용됨).
apiVersion: v1
kind: Secret
metadata:
  # ⚠️ 이름은 **실제 AKS 클러스터명**을 쓴다 — ApplicationSet cluster generator의 {{name}}이
  #    alb-controller 컨트롤러의 clusterName 파라미터로 그대로 흘러가지는 않지만(AGFC는
  #    clientID만 요구, live/hub/aks/main.tf naming과 일치시켜 혼선을 없앤다.
  name: aks-demo-hub-krc-main-01
  namespace: argocd
  labels:
    # ArgoCD가 이 Secret을 클러스터 등록으로 인식하는 키 (필수)
    argocd.argoproj.io/secret-type: cluster
    # ── baseline addon ApplicationSet selector 소스 ──
    # addons/baseline/alb-controller.yaml의 cluster generator는 이 키의 **존재만** 검사한다
    # (matchExpressions Exists) — 전 클러스터 자동 팬아웃, 값 자체는 분류용이다.
    environment: hub
    # hub는 ArgoCD control-plane의 영구 거처다(dev처럼 재구축 대상이 아니다) — prd로 분류.
    tier: prd
    region: krc
    # ── per-cluster addon 파라미터 소스 (ALB controller의 workload identity clientID) ──
    # 클러스터명에서 파생 불가 - live/hub/aks가 소유하는 identity의 clientId(재구축을 견딤,
    # 클러스터와 identity의 수명주기가 분리돼 있음 - AWS 원본의 karpenterNodeRole과 같은 계열).
    # 실측(2026-09-04): az identity show -g rg-demo-hub-krc-workload-01
    #   -n id-demo-hub-krc-alb-controller-01 --query clientId -o tsv
    # 값이 GUID(36자, 영숫자+하이픈)라 K8s 라벨 값 제약(63자·문자 제한)을 통과한다 —
    # 아래 albSubnetId와 달리 label로 유지 가능함을 확인 후 결정.
    albControllerClientId: "5d5b3144-b21b-495e-a1b0-f8f83b1ede3c"
    # ⛔ **albSubnetId는 라벨에 없다 — 실측으로 라벨 제약을 위반함을 확인했다(2026-09-04)**.
    #    실제 값(az network vnet subnet show ... --query id -o tsv):
    #      /subscriptions/.../resourceGroups/rg-demo-hub-krc-workload-01/providers/
    #      Microsoft.Network/virtualNetworks/vnet-demo-hub-krc-main/subnets/snet-demo-hub-krc-alb
    #    길이 191자(한도 63자) + '/' 포함(라벨 값 허용 문자 아님, k8s.io 라벨 값 정규식
    #    `(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?`을 두 축 모두 위반) — 계획서
    #    1-1절이 "실측 필요"로 남겨둔 항목의 답이 "안 된다"로 확정됨.
    #    ⇒ 같은 디렉토리의 values.yaml로 전환(계획서가 예비해 둔 대안, root-app.yaml의
    #       `exclude: '{clusters/**/values.yaml,...}'`가 이미 이 파일 형태를 전제하고 있었다).
    addon-alb-controller: enabled
    # addons/catalog/karpenter.yaml의 opt-in 셀렉터. aks-reference-infra PR #11
    # (live/hub/aks, enable_karpenter=true)과 짝을 이룬다 — 이 라벨만으로 NodePool/
    # AKSNodeClass CR이 이 클러스터에 팬아웃된다(dev는 아직 이 라벨이 없어 제외됨).
    addon-karpenter: enabled
type: Opaque
stringData:
  name: aks-demo-hub-krc-main-01
  # ⚠️ self-managed는 클러스터 내부 워크로드라 이 URL로 자기 apiserver에 닿는다.
  server: https://kubernetes.default.svc
  # ⚠️ 함정 — 이 값을 지정하면 그 프로젝트에서만 destination으로 쓸 수 있는 project-scoped
  #    cluster가 된다. projects/platform.yaml의 이름과 반드시 일치해야 한다.
  project: platform
