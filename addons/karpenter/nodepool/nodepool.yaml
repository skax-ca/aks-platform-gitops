apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  # ⛔ "default"를 쓰지 않는다 — NAP을 켜면 Azure가 자기 own default_node_pools=Auto로
  #    "default"·"system-surge" NodePool을 자동 생성한다(공식문서 node-auto-provisioning-
  #    node-pools). 같은 이름을 쓰면 그 자동 생성 리소스와 소유권이 충돌한다. upstream
  #    공식 예제 파일명 자체도 "general-purpose"라 이 이름을 그대로 채택했다(우리가
  #    지어낸 값이 아니다) — 두 NodePool(Azure 자동 생성분 + 이것)이 당분간 공존한다는
  #    뜻이므로, default_node_pools=None으로 끄고 싶어지면 iac-module-library의
  #    aks-cluster 모듈에 그 필드를 새로 노출하는 별도 변경이 필요하다(지금은 범위 밖).
  name: general-purpose
  annotations:
    kubernetes.io/description: >-
      플랫폼 baseline NodePool(범용). 업스트림 공식 예제(github.com/Azure/karpenter-provider-azure
      examples/v1/general-purpose.yaml)를 이 클러스터(cni_mode=overlay + network_data_plane=
      cilium, live/hub/aks/main.tf)에 맞춰 그대로 채택 — Cilium daemonset이 붙기 전 워크로드
      스케줄을 막는 라벨+startupTaint가 이 조합에서는 필수다.
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    metadata:
      labels:
        # Karpenter가 Cilium daemonset 오버헤드를 예측하려면 필요하다(공식 예제 주석 원문:
        # "required for Karpenter to predict overhead from cilium DaemonSet").
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: general-purpose
      startupTaints:
        # Cilium이 아직 안 붙은 노드에 워크로드가 스케줄되는 것을 막는다
        # (karpenter.sh 공식 문서: Cilium startup taint 패턴, 업스트림 예제와 동일).
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
          value: "true"
      expireAfter: Never
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.azure.com/sku-family
          operator: In
          values: ["D"]
