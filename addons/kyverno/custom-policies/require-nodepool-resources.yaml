# 이 저장소가 직접 소유하는 ClusterPolicy. 업스트림 PSS 정책과 별도 Application 인 이유는
# applicationsets/baseline/kyverno-custom-policies.yaml 헤더가 갖는다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-nodepool-resources
  annotations:
    policies.kyverno.io/title: Require CPU/Memory Requests and Memory Limit
    policies.kyverno.io/category: Platform
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      AKS Node Auto-Provisioning(NAP, karpenter-provider-azure 기반)은 파드의
      spec.containers[*].resources.requests를 기준으로 바인패킹·노드 크기·스케일링을
      계산한다. requests가 없으면 그 계산이 틀어지고, memory limit이 없으면 파드 하나가
      노드 메모리를 무제한으로 잠식해 다른 파드를 OOM으로 몰아낼 수 있다. 그래서
      requests(cpu·memory)와 memory limit을 필수로 요구한다.
      ⚠️ cpu limit은 의도적으로 요구하지 않는다 — CPU는 압축 가능한 자원이라 limit을
      걸면 스로틀링으로 지연시간이 튀는 문제가 있다. 이는 업스트림 Kyverno best-practice
      정책(require-requests-limits, kyverno.io/policies/best-practices)과 AWS EKS
      Best Practices Guide가 공통으로 권고하는 방향이고, Karpenter 코어를 공유하는 NAP에도
      동일하게 적용된다.
spec:
  # ⚠️ Enforce 다 — Audit 으로 먼저 관찰하지 않고 바로 차단한다. failurePolicy 는 적지 않는다.
  #    ClusterPolicy 기본값 Fail 이 Enforce 와 짝이 맞는 조합이다(업스트림 PSS 정책이
  #    Audit + Ignore 로 짝을 맞춘 것과 같은 원칙, 반대 방향).
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory-requests-and-memory-limit
      match:
        any:
          - resources:
              kinds:
                - Pod
              # AKS 가 관리하는 네임스페이스를 통째로 뺀다. ⚠️ 빼지 않으면 관리형 addon 이 뜨지
              # 못한다 — App Routing 의 istiod 는 requests/limits 를 선언하지 않아 Azure 내부
              # 컨트롤러의 재시도가 이 정책에 매번 막히고, 에러는 Kyverno 로그에만 남는다.
              # 이름 대신 라벨로 거르는 이유는 Azure 가 새 aks-*-system 네임스페이스로 관리형
              # addon 을 내놓아도 같은 사고가 재발하지 않게 하기 위해서다.
              # exclude 가 아니라 match 에 두는 이유: exclude 쪽 namespaceSelector 가 무시되는
              # Kyverno 버그 보고가 있다. match 쪽은 공식 문서 예제에 그대로 나오는 경로다.
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.azure.com/managedby
                    operator: NotIn
                    values:
                      - aks
      exclude:
        any:
          # ArgoCD 는 이 저장소가 직접 배포하는 플랫폼 컴포넌트라 위 라벨로 걸러지지 않는다.
          # argo-cd 차트가 모든 컴포넌트를 resources: {} 로 두고 argocd-values.yaml 도 그 값을
          # 채우지 않아서, 빼지 않으면 ArgoCD 자신의 재배포가 이 정책에 막힌다.
          - resources:
              namespaces:
                - argocd
      validate:
        message: >-
          NAP이 올바르게 스케줄링하려면 모든 컨테이너에 CPU/메모리 requests와
          메모리 limit이 필요하다(cpu limit은 의도적으로 요구하지 않는다).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
