# Kyverno 커스텀 정책 — baseline addon. 이 저장소가 직접 소유하는 ValidatingPolicy 다.
#
# 업스트림 정책(kyverno-policies.yaml)과 Application 을 나눈다. 그쪽은 source 가 차트 하나로
#    고정돼 있어 우리가 만든 정책을 끼워 넣을 자리가 없다.
# uniform 인 이유: targetRevision 이 main 이라 승격할 버전이 없다. ⚠️ 그래서 양 티어가 같은 정책을
#    본다 — 엔진 승격이 진행 중이면 이 정책이 두 엔진 버전 모두에서 유효해야 한다. 새 버전에서 생긴
#    필드를 쓰려면 엔진 승격을 끝내고 커밋한다.
#
# 설계: iac-module-library의 docs/architectures/gitops-hub-spoke/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-custom-policies
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{name}}-kyverno-custom-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        # 평문 매니페스트 디렉토리다 — 클러스터마다 갈리는 값이 없어 주입할 것이 없다.
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/kyverno/custom-policies
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
