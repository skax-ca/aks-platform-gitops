# +argocd:skip-file-rendering
#   ⚠️ 이 마커는 root-app(directory 소스)이 이 파일을 매니페스트로 읽지 않게 한다.
#      root-app의 exclude로 하지 않는 이유는 README의 "root App 스캔에서 파일을 빼는
#      방법" 절 참조(AWS 원본 skax-ca/eks-platform-gitops README와 동일 규약,
#      addons/karpenter/nodepool·addons/gateway/shared-gateway와 동일 패턴).
apiVersion: v2
name: kyverno-custom-policies
description: |
  이 저장소가 직접 소유하는 Kyverno ClusterPolicy 모음 — 계층 2(플랫폼 GitOps)가 소유.
  AWS 원본 eks-platform-gitops의 addons/kyverno/custom-policies를 그대로 포팅했다 —
  정책 자체(Pod resources.requests/limits 요구)가 클라우드 중립적이라 로직 변경이 없다.

  Chart.yaml이 있어야 kyverno-custom-policies Application이 Directory 타입이 아니라
  Helm 타입으로 인식되고, 그래야 templates/ 안의 skip-file-rendering 마커가 "root-app만
  제외"라는 원래 뜻대로 동작한다(AWS 원본도 같은 함정을 피하려고 이 형태다).
type: application
version: 0.1.0
