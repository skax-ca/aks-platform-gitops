# Kyverno 커스텀 정책 — ①baseline addon (이 저장소가 직접 소유하는 ClusterPolicy)
#
# 설계: AWS 원본 skax-ca/eks-platform-gitops의 addons/baseline/kyverno-custom-policies.yaml과
#       같은 구조다. 강제 대상만 다르다(AWS는 Karpenter NodePool, 여기는 NAP NodePool).
#
# **Kyverno는 파일 3개이고 이것이 ③이다** — ① 엔진은 `kyverno.yaml`, ② PSS 정책은
#    `kyverno-policies.yaml`. 파일이 나뉜 이유는 `kyverno.yaml` 헤더가 갖는다.
#
# **②와 별도 Application 인 이유는 소유권이다.** ②는 업스트림 차트 하나로 source 가 고정돼
#    있어 임의의 새 정책을 주입할 수 없다. 그래서 우리가 직접 만든 정책은 형제 Application 으로
#    따로 둔다.
#
# **uniform 인 이유**: `targetRevision: main` 이라 승격할 버전이 없다. ①②가 staged 로 나뉘어도
#    이 파일은 나누지 않는다.
#    ⚠️ 그래서 **양 티어가 같은 정책을 본다.** ①의 승격이 진행 중일 때(nonprd 가 새 CRD, prd 가
#       옛 CRD) 이 정책은 **두 엔진 버전 모두에서 유효해야** 한다. 새 버전에서 생긴 필드를 쓰려면
#       ①②의 승격을 끝내고 커밋한다.
#
# ────────────────────────────────────────────────────────────────────────────
# ③ 커스텀 정책 — NodePool 자원 요구사항 강제 (uniform)
# ────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-custom-policies
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: '{{name}}-kyverno-custom-policies'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "5"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        # 이 저장소가 직접 소유하는 정책 — 로컬 helm 차트(Chart.yaml 존재)라서 root-app의
        # 최상위 Directory 스캔에서 제외된다(AWS 원본과 동일 규약, Chart.yaml 헤더 참조).
        repoURL: https://github.com/skax-ca/aks-platform-gitops.git
        targetRevision: main
        path: addons/kyverno/custom-policies
      destination:
        server: '{{server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
